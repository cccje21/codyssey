<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>당신이 동화 속 주인공이라면?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF6E5;--lav:#B8A4E8;--sky:#9ED8F5;--pink:#FFB3D1;--green:#3F7D4E;--leaf:#CDEBC5;--ink:#2B2340;--muted:#6B6585;--purple:#7963AE;
--px:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);
--bev:inset 4px 4px 0 0 rgba(255,255,255,.7),inset -4px -4px 0 0 rgba(43,35,64,.14);
--chk:conic-gradient(#FFF6E5 25%,#EFE6FF 0 50%,#FFF6E5 0 75%,#EFE6FF 0) 0 0/16px 16px;
--chks:conic-gradient(#9ED8F5 25%,#B3E3F8 0 50%,#9ED8F5 0 75%,#B3E3F8 0) 0 0/16px 16px}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(circle at 50% 45%,rgba(255,215,240,.38),transparent 48%) fixed,linear-gradient(180deg,#2E2B63 0%,#6A59B5 38%,#C79AE6 68%,#FFC3DC 100%) fixed;align-items:center;color:var(--ink);font-family:"DotGothic16","Galmuri11","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6;display:flex;justify-content:center;padding:20px 18px}
main{position:relative;width:100%;max-width:560px;background:var(--cream);box-shadow:var(--px),8px 12px 0 0 var(--ink);padding:64px 24px 30px;align-self:center;z-index:1;min-height:520px}
.round{font-family:"Jua","Gaegu","Hi Melody","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.screen{display:none}.screen.on{display:block}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:var(--sky);box-shadow:var(--px),var(--bev);padding:14px 20px;min-height:48px}
button:hover:not(:disabled){transform:translateY(-3px)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:var(--px)}
button:focus-visible{outline:4px solid var(--green);outline-offset:6px}
button:disabled{opacity:.4;cursor:not-allowed}
.big{width:100%;font-size:24px;background:var(--pink)}
.bgm{position:fixed;top:14px;right:14px;min-height:40px;padding:4px 12px;font-size:14px;background:var(--leaf)}
.bgm.playing{background:var(--pink)}
main.res .bgm{display:none}
.meta{display:flex;justify-content:space-between;font-size:16px;margin-bottom:8px}
.bar{height:20px;background:#fff;box-shadow:var(--px)}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s steps(6)}
h2{font-size:21px;line-height:1.5;margin:26px 0 20px;word-break:keep-all}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-bottom:18px;background:#fff;font-size:17px;word-break:keep-all}
.opt b{flex:none;width:30px;height:30px;line-height:30px;text-align:center;background:var(--lav);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.opt.sel{background:var(--leaf)}
.prev{background:var(--cream);margin-top:6px}
.type{font-size:clamp(38px,12vw,52px);line-height:1.2;letter-spacing:.12em;padding-left:.12em;margin:0;text-align:center;color:var(--cream);text-shadow:-3px 0 0 var(--ink),3px 0 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink),6px 6px 0 var(--purple)}
.card{margin:6px 0 20px;padding:0;background:radial-gradient(ellipse 80% 62% at 50% 64%,rgba(255,246,229,.5),rgba(255,246,229,0) 72%)}
.img{--glow:drop-shadow(0 0 26px rgba(255,160,215,.4));position:relative;isolation:isolate;width:min(320px,100%);aspect-ratio:1;margin:0 auto 4px}
.img::after{content:"";position:absolute;z-index:-1;left:24%;right:24%;bottom:3%;height:16px;background:radial-gradient(ellipse,rgba(43,35,64,.38),transparent 70%);animation:shade 3s ease-in-out .8s infinite}
.img img{width:100%;height:100%;object-fit:contain;display:block}
.img img.hero{filter:var(--glow);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both,bob2 3s ease-in-out .8s infinite}
@keyframes pop{0%{transform:scale(.3) translateY(30px);opacity:0;filter:brightness(3) var(--glow)}60%{opacity:1}100%{transform:scale(1)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shade{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.78);opacity:.55}}
.card p{text-shadow:0 0 8px rgba(255,246,229,.95),0 0 3px rgba(255,246,229,.9)}
.img.ph{display:flex;align-items:center;justify-content:center;border:3px dashed #B9A9D6;color:#82749B;font-size:18px}
.name{text-align:center;font-size:30px;line-height:1.3;margin:0;color:#54416F}
.role{text-align:center;margin:2px 0 16px;color:#8A5F8E;font-size:22px}
.desc{margin:0 0 14px;font-size:20px;line-height:1.75;text-align:center;word-break:keep-all}
.quote{margin:0;font-size:20px;line-height:1.7;text-align:center;color:#67577E;word-break:keep-all}
.small{display:block;margin:0 auto;min-height:44px;padding:8px 26px;font-size:18px;background:var(--pink)}
main.res{background:none;box-shadow:none;padding-top:28px;min-height:0}
.eyebrow{margin:0 0 8px;text-align:center;font-size:16px;letter-spacing:.06em;color:#8A5E0A}
.stitle{margin:0 0 10px;text-align:center;font-weight:400;font-size:clamp(28px,8vw,42px);line-height:1.3;color:#54416F;text-shadow:3px 3px 0 var(--pink);word-break:keep-all}
.ssub{margin:0 0 20px;text-align:center;font-size:20px;line-height:1.6;color:var(--muted);word-break:keep-all}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body.st main{background:none;box-shadow:none;padding:0 12px;min-height:0}
body.st .eyebrow{color:#FFE9A8}
body.st .stitle{color:#FFF6E5;font-size:clamp(32px,9vw,50px);text-shadow:3px 3px 0 var(--purple),0 0 22px rgba(255,190,225,.85);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{text-shadow:3px 3px 0 var(--purple),0 0 34px rgba(255,220,240,1)}}
body.st .ssub{color:#EADFFF}
body.st .tag{color:#FFF6E5;margin:34px 0 22px}
body.st .cap{color:#D8CBF2}
.tag{margin:0 0 18px;text-align:center;font-size:24px;color:#54416F;word-break:keep-all}
.go{display:block;width:auto;margin:0 auto;padding:12px 34px;background:#F2C14E}
.cap{margin:20px 0 0;text-align:center;font-size:16px;letter-spacing:.06em;color:var(--muted)}
body.res .name{color:#FFF6E5}
body.res .card .role{color:#FFC2E2;font-size:30px;letter-spacing:.04em;text-shadow:-2px 0 #4A3A7A,2px 0 #4A3A7A,0 -2px #4A3A7A,0 2px #4A3A7A,0 0 16px rgba(255,140,205,.85)}
body.res .desc,body.res .quote{color:#F3EAFF}
body.res .card p{text-shadow:0 0 10px rgba(46,43,99,.9),0 2px 0 rgba(46,43,99,.55)}
body.res .card{background:radial-gradient(ellipse 85% 60% at 50% 66%,rgba(54,40,110,.5),rgba(54,40,110,0) 74%)}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btns .small{margin:0}
#save{background:#F2C14E}
#result{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.elabel{margin:0 0 4px;text-align:center;font-size:13px;font-weight:700;letter-spacing:.34em;padding-left:.34em;color:#FFE9A8}
#result .type{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:.22em;padding-left:.22em;color:#FFF6E5;text-shadow:0 3px 0 #4A3A7A,0 0 26px rgba(255,180,225,.65)}
.esub{margin:4px 0 0;text-align:center;font-size:16px;letter-spacing:.02em;color:#EADFFF;word-break:keep-all}
#result .card p{text-shadow:0 1px 8px rgba(46,43,99,.55)}
#result .name{font-size:28px;font-weight:700;letter-spacing:.05em}
#result .card .role{font-size:24px;font-weight:700;letter-spacing:.06em;line-height:1.4;margin:12px 0 18px;text-shadow:-1px 0 #4A3A7A,1px 0 #4A3A7A,0 -1px #4A3A7A,0 1px #4A3A7A,0 0 14px rgba(255,140,205,.7)}
#result .desc{font-size:17px;line-height:1.85;letter-spacing:.01em;text-wrap:balance}
#result .quote{font-size:16px;font-weight:500;line-height:1.7;letter-spacing:.01em;text-wrap:balance;padding:12px 18px;border-radius:14px;background:rgba(255,246,229,.15);border:1px solid rgba(255,255,255,.25)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:380px){main{padding:64px 14px 24px}}
</style>
</head>
<body class="st">
<main>
  <button class="bgm" id="bgm" aria-label="배경음악 재생">♪ 재생</button>
  <section id="start" class="screen round on">
    <p class="eyebrow">✦ A LITTLE FANTASY ADVENTURE ✦</p>
    <h1 class="stitle">당신이 동화 속 주인공이라면?</h1>
    <p class="ssub">당신은 어떤 세계에서 어떤 모습으로 살아갈까요?</p>
    <p class="tag">당신만의 이야기를 시작해 보세요.</p>
    <button class="big go" id="go">모험 시작하기 ▶︎</button>
    <p class="cap">PIXEL HEROES MBTI</p>
  </section>

  <section id="quiz" class="screen">
    <div class="meta"><span id="prog">1 / 12</span></div>
    <div class="bar"><i id="fill"></i></div>
    <h2 id="q"></h2>
    <button class="opt" id="a"></button>
    <button class="opt" id="b"></button>
    <button class="prev" id="prev">이전 질문</button>
  </section>

  <section id="result" class="screen round">
    <p class="elabel">YOUR FAIRYTALE CHARACTER</p>
    <p class="type" id="rType"></p>
    <div class="card">
      <div class="img" id="rImg"></div>
      <p class="name" id="rName"></p>
      <p class="role" id="rRole"></p>
      <p class="desc" id="rDesc"></p>
      <p class="quote" id="rQuote"></p>
    </div>
    <div class="btns"><button class="small" id="save">✦ 이미지로 저장</button><button class="small" id="again">다시 테스트하기</button></div>
  </section>
</main>

const $ = id => document.getElementById(id);
let answers = [];   // 0 = A, 1 = B
let cur = 0;

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  document.querySelector("main").classList.toggle("res", id === "result");
  document.body.classList.toggle("res", id === "result");
  document.body.classList.toggle("st", id === "start");
  fxShow(id);
  window.scrollTo(0, 0);
}

function renderQ(){
  $("prog").textContent = (cur + 1) + " / 12";
  $("fill").style.width = ((cur + 1) / 12 * 100) + "%";
  $("q").textContent = Q[cur][0];
  $("a").innerHTML = "<b>A</b>";
  $("b").innerHTML = "<b>B</b>";
  $("a").append(Q[cur][1]);
  $("b").append(Q[cur][2]);
  $("a").classList.toggle("sel", answers[cur] === 0);
  $("b").classList.toggle("sel", answers[cur] === 1);
  $("prev").disabled = cur === 0;
}

function pick(v){
  answers[cur] = v;
  if (cur < 11){ cur++; renderQ(); }
  else { renderResult(); }
}

function calcType(){
  let t = "";
  for (let d = 0; d < 4; d++){
    const pair = DIMS[d * 3];
    let a = 0;
    for (let i = d * 3; i < d * 3 + 3; i++) if (answers[i] === 0) a++;
    t += a >= 2 ? pair[0] : pair[1];
  }
  return t;
}

function renderResult(){
  const t = calcType(), c = C[t];
  lastT = t;
  $("rType").textContent = t;
  const box = $("rImg");
  box.textContent = "";
  box.className = IMAGES[t] ? "img" : "img ph";
  if (IMAGES[t]){
    const im = document.createElement("img");
    im.src = IMAGES[t];
    im.alt = c[0] + " 캐릭터 이미지";
    im.className = "hero";
    box.append(im);
  } else {
    box.textContent = "캐릭터 이미지";
  }
  $("rName").textContent = c[0];
  $("rRole").textContent = c[1];
  $("rDesc").textContent = c[2];
  $("rQuote").textContent = "\u201C" + c[3] + "\u201D";
  show("result");
  setTimeout(() => { const r = box.getBoundingClientRect(); fxBurst(r.left + r.width / 2, r.top + r.height / 2); }, 500);
}

/* 도트 이펙트: 별빛 도트 + 픽셀 달과 구름, 결과 화면의 도트 폭죽 */
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fxCv = document.createElement("canvas");
fxCv.id = "fx";
document.body.prepend(fxCv);
const fxG = fxCv.getContext("2d");
const FXC = ["#FFF6E5", "#FFB3D1", "#9ED8F5", "#F2C14E", "#CDEBC5", "#B8A4E8"];
const rnd = a => a[Math.random() * a.length | 0];
const stars = Array.from({length: 110}, () => ({x: Math.random(), y: Math.random(), s: rnd([4, 4, 4, 12]), v: .004 + Math.random() * .01, p: Math.random() * 6.3, c: rnd(FXC)}));
const orbs = Array.from({length: 7}, () => ({x: Math.random(), y: Math.random(), r: 60 + Math.random() * 90, p: Math.random() * 6.3, c: rnd(["255,179,209", "158,216,245", "242,193,78", "184,164,232"])}));
const CLOUD = ["    ####    ", "  ########  ", " ########## ", "############"];
let fxW = 0, fxH = 0, fxMode = "start", fxParts = [], fxShoot = [], fxPos = null;

function cell(x, y){ fxG.fillRect(Math.round(x / 4) * 4, Math.round(y / 4) * 4, 4, 4); }
function dot(x, y, s){   // s=12 이면 십자 반짝이
  cell(x, y);
  if (s >= 12){ cell(x - 4, y); cell(x + 4, y); cell(x, y - 4); cell(x, y + 4); }
}

function fxDraw(t){
  fxG.clearRect(0, 0, fxW, fxH);
  {
    fxG.shadowColor = "#FFE9A8"; fxG.shadowBlur = 24; fxG.fillStyle = "#FFF1B8";
    for (let i = -11; i <= 11; i++) for (let j = -11; j <= 11; j++)
      if (i * i + j * j <= 121 && (i - 4) * (i - 4) + (j + 3) * (j + 3) > 121) fxG.fillRect(fxW - 80 + i * 4, 90 + j * 4, 4, 4);
    fxG.shadowBlur = 0; fxG.fillStyle = "rgba(255,255,255,.26)";
    [[0, .80, .02], [.5, .62, .013], [.8, .9, .03]].forEach(([o, yy, sp]) => {
      const cx = ((t * sp + o * (fxW + 400)) % (fxW + 400)) - 200;
      CLOUD.forEach((row, r) => [...row].forEach((ch, c) => {
        if (ch === "#") fxG.fillRect(Math.round((cx + c * 8) / 8) * 8, Math.round(yy * fxH / 8) * 8 + r * 8, 8, 8);
      }));
    });
  }
  if (fxMode === "result"){   // 몽글몽글 떠다니는 빛망울
    orbs.forEach(o => {
      const ox = (o.x + Math.sin(t / 4000 + o.p) * .05) * fxW, oy = (o.y + Math.cos(t / 5000 + o.p) * .05) * fxH;
      const gr = fxG.createRadialGradient(ox, oy, 0, ox, oy, o.r);
      gr.addColorStop(0, "rgba(" + o.c + ",.28)"); gr.addColorStop(1, "rgba(" + o.c + ",0)");
      fxG.fillStyle = gr; fxG.fillRect(ox - o.r, oy - o.r, o.r * 2, o.r * 2);
    });
  }
  stars.forEach((o, n) => {
    if (n >= 70 && fxMode !== "result") return;
    const y = ((o.y - t * o.v / 1000) % 1 + 1) % 1;
    fxG.globalAlpha = .3 + .7 * Math.abs(Math.sin(t / 700 + o.p));
    fxG.fillStyle = o.c;
    dot(o.x * fxW, y * fxH, o.s);
  });
  if (fxMode === "result" && fxPos && !calm && Math.random() < .22)
    fxParts.push({x: fxPos.x + (Math.random() - .5) * 260, y: fxPos.y + (Math.random() - .2) * 240, vx: 0, vy: -.7, g: 0, s: rnd([4, 4, 12]), c: rnd(FXC), l: 1});
  if (fxMode === "result" && !calm){
    if (Math.random() < .12) fxParts.push({x: Math.random() * fxW, y: -8, vx: (Math.random() - .5) * .4, vy: .6 + Math.random(), g: 0, d: .003, s: rnd([4, 4, 12]), c: rnd(FXC), l: 1});
    if (Math.random() < .006) fxShoot.push({x: fxW * (.4 + Math.random() * .6), y: Math.random() * fxH * .4, vx: -9, vy: 4.5, l: 1});
    fxShoot = fxShoot.filter(p => p.l > 0 && p.x > -50);
    fxShoot.forEach(p => {   // 도트 꼬리가 달린 별똥별
      p.x += p.vx; p.y += p.vy; p.l -= .008;
      for (let k = 0; k < 10; k++){
        fxG.globalAlpha = Math.max(p.l, 0) * (1 - k / 10);
        fxG.fillStyle = k < 2 ? "#FFF6E5" : "#FFE9A8";
        cell(p.x - p.vx * k * .9, p.y - p.vy * k * .9);
      }
    });
    fxG.globalAlpha = 1;
  }
  fxParts = fxParts.filter(p => p.l > 0);
  fxParts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.l -= p.d || (p.g ? .013 : .01);
    fxG.globalAlpha = Math.max(p.l, 0); fxG.fillStyle = p.c;
    dot(p.x, p.y, p.s);
  });
  fxG.globalAlpha = 1;
}

function fxSize(){
  const d = window.devicePixelRatio || 1;
  fxW = innerWidth; fxH = innerHeight;
  fxCv.width = fxW * d; fxCv.height = fxH * d;
  fxG.setTransform(d, 0, 0, d, 0, 0);
  fxDraw(0);
}
function fxShow(id){ fxMode = id; if (id !== "result") fxPos = null; if (calm) fxDraw(0); }
function fxBurst(x, y){   // 결과가 나올 때 캐릭터 주변에서 도트가 터짐
  fxPos = {x, y};
  if (calm) return;
  for (let i = 0; i < 120; i++){
    const a = Math.random() * 6.3, v = 2 + Math.random() * 7;
    fxParts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: .18, s: rnd([4, 4, 8, 12]), c: rnd(FXC), l: 1});
  }
}
addEventListener("resize", fxSize);
fxSize();
if (!calm) requestAnimationFrame(function loop(t){ fxDraw(t); requestAnimationFrame(loop); });

let lastT = "";
const FONT = ' Jua, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
function wrap(x, txt, w){
  const out = []; let line = "";
  for (const word of txt.split(" ")){
    const tryL = line ? line + " " + word : word;
    if (x.measureText(tryL).width > w && line){ out.push(line); line = word; } else line = tryL;
  }
  if (line) out.push(line);
  return out;
}
const FT = ' "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
function spaced(x, txt, cx, y, sp, stroke){   // 자간을 직접 주어 가운데 정렬
  const cs = [...txt], ws = cs.map(ch => x.measureText(ch).width);
  let px = cx - (ws.reduce((p, q) => p + q, 0) + sp * (cs.length - 1)) / 2;
  x.textAlign = "left";
  cs.forEach((ch, i) => { if (stroke) x.strokeText(ch, px, y); else x.fillText(ch, px, y); px += ws[i] + sp; });
  x.textAlign = "center";
}

/* 배경음악: 코드로 직접 만든 칩튠 반복 음악이라 따로 받을 파일도, 저작권 걱정도 없습니다.
   다른 무료 음원을 쓰고 싶다면 BGM_SRC에 data:audio/mp3;base64,... 를 넣으세요. */
const BGM_SRC = "";
const BPM = 92, STEP = 60 / BPM / 2;
const CH = [[48,60,64,67],[45,57,60,64],[41,53,57,60],[43,55,59,62]];   // 도, 라단조, 파, 솔
const MEL = ("76 . 79 . 84 . 81 79  81 . 79 . 76 . 72 -  72 . 76 . 81 . 79 76  74 . 79 . 76 74 72 -" +
             "  84 . 81 . 79 . 76 79  81 . 84 . 81 . 79 -  77 . 81 . 84 . 81 77  79 . 74 . 71 . 74 -").trim().split(/\s+/);
const NOTE = [];   // 박자별 [음, 길이]
MEL.forEach((t, i) => {
  if (t === "." || t === "-") return;
  let len = 1;
  while (MEL[i + len] === ".") len++;
  NOTE[i] = [+t, len];
});
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
let ctx = null, master = null, timer = null, audio = null, step = 0, nextT = 0, playing = false, autoDone = false;

function tone(m, t, dur, type, vol){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = hz(m);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

function playStep(s, t){
  const c = CH[(s >> 3) % 4], i = s & 7;
  if (i % 4 === 0) tone(c[0], t, STEP * 3.6, "triangle", 0.5);
  tone(c[1 + [0,1,2,1,0,1,2,1][i]], t, STEP * 0.9, "square", 0.1);
  if (NOTE[s]) tone(NOTE[s][0], t, STEP * NOTE[s][1] * 0.95, "square", 0.2);
}

function startBgm(){
  if (BGM_SRC){
    audio = audio || Object.assign(new Audio(BGM_SRC), { loop: true, volume: 0.5 });
    audio.play();
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = 0.18;
  master.connect(ctx.destination);
  step = 0; nextT = ctx.currentTime + 0.1;
  timer = setInterval(() => {
    while (nextT < ctx.currentTime + 0.3){
      playStep(step, nextT);
      nextT += STEP;
      step = (step + 1) % MEL.length;
    }
  }, 80);
}

function stopBgm(){
  if (audio) audio.pause();
  if (timer) clearInterval(timer);
  timer = null;
  if (ctx){ ctx.close(); ctx = null; }
}

function setBgm(on){
  playing = on;
  if (on) startBgm(); else stopBgm();
  $("bgm").classList.toggle("playing", on);
  $("bgm").textContent = on ? "♪ 정지" : "♪ 재생";
  $("bgm").setAttribute("aria-label", on ? "배경음악 정지" : "배경음악 재생");
}
$("bgm").onclick = () => setBgm(!playing);
</script>
