--px:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);
--bev:inset 4px 4px 0 0 rgba(255,255,255,.7),inset -4px -4px 0 0 rgba(43,35,64,.14);
--chk:conic-gradient(#FFF6E5 25%,#EFE6FF 0 50%,#FFF6E5 0 75%,#EFE6FF 0) 0 0/16px 16px;

*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--lav);color:var(--ink);font-family:"DotGothic16","Galmuri11","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6;display:flex;justify-content:center;padding:20px 18px}
main{position:relative;width:100%;max-width:560px;background:var(--cream);box-shadow:var(--px),8px 12px 0 0 var(--ink);padding:64px 24px 30px;align-self:flex-start}
.round{font-family:"Jua","Gaegu","Hi Melody","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.screen{display:none}.screen.on{display:block}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:var(--sky);box-shadow:var(--px),var(--bev);padding:14px 20px;min-height:48px}
button:hover:not(:disabled){transform:translateY(-3px)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:var(--px)}
button:focus-visible{outline:4px solid var(--green);outline-offset:6px}
button:disabled{opacity:.4;cursor:not-allowed}
.big{width:100%;font-size:24px;background:var(--pink)}
.bgm{position:absolute;top:14px;right:14px;min-height:40px;padding:4px 12px;font-size:14px;background:var(--leaf)}
.bgm.playing{background:var(--pink)}
main.res .bgm{display:none}
.meta{display:flex;justify-content:space-between;font-size:16px;margin-bottom:8px}
.bar{height:20px;background:#fff;box-shadow:var(--px)}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s steps(6)}
h2{font-size:21px;line-height:1.5;margin:26px 0 20px;word-break:keep-all}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-bottom:18px;background:#fff;font-size:17px;word-break:keep-all}
.opt b{flex:none;width:30px;height:30px;line-height:30px;text-align:center;background:var(--lav);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.opt.sel{background:var(--leaf)}
.prev{background:var(--cream);margin-top:6px}
.type{font-size:clamp(38px,12vw,52px);line-height:1.2;letter-spacing:.12em;padding-left:.12em;margin:0;text-align:center;color:var(--cream);text-shadow:-3px 0 0 var(--ink),3px 0 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink),6px 6px 0 var(--purple)}
.card{margin:22px 0 26px;padding:22px 20px 26px;background:linear-gradient(150deg,#F4EFFB,#FFF8F0);box-shadow:var(--px),var(--bev)}
.img{width:min(320px,100%);aspect-ratio:1;margin:0 auto 4px}
.img img{width:100%;height:100%;object-fit:contain;display:block}
.img.ph{display:flex;align-items:center;justify-content:center;border:3px dashed #B9A9D6;color:#82749B;font-size:18px}
.name{text-align:center;font-size:30px;line-height:1.3;margin:0;color:#54416F}
.role{text-align:center;margin:2px 0 16px;color:#8A5F8E;font-size:22px}
.desc{margin:0 0 14px;font-size:20px;line-height:1.75;text-align:center;word-break:keep-all}
.quote{margin:0;font-size:20px;line-height:1.7;text-align:center;color:#67577E;word-break:keep-all}
.small{display:block;margin:0 auto;min-height:44px;padding:8px 26px;font-size:18px;background:var(--pink)}
body.res{background:#B8A4E8 var(--forest) center bottom/cover no-repeat}
main.res{background:none;box-shadow:none;padding-top:28px}
.eyebrow{margin:0 0 8px;text-align:center;font-size:16px;letter-spacing:.06em;color:#8A5E0A}
.stitle{margin:0 0 10px;text-align:center;font-weight:400;font-size:clamp(28px,8vw,42px);line-height:1.3;color:#54416F;text-shadow:3px 3px 0 var(--pink);word-break:keep-all}
.ssub{margin:0 0 20px;text-align:center;font-size:20px;line-height:1.6;color:var(--muted);word-break:keep-all}
/* 시작 화면 캐릭터 무대 */
.party {
  position: relative;
  width: min(760px, 100%);
  height: 230px;
  margin: 12px auto 20px;
  padding: 0;
  display: block;
  background: transparent;
  border: 0;
  box-shadow: none;
  overflow: visible;
}

/* 자유롭게 배치되는 캐릭터 */
.party img {
  position: absolute;
  width: clamp(58px, 8vw, 92px);
  height: auto;
  object-fit: contain;
  image-rendering: pixelated;
  filter: drop-shadow(2px 3px 0 rgba(43, 35, 64, 0.16));
  animation: heroFloat 2.2s ease-in-out infinite;
  transform-origin: center bottom;
  translate: -50% -50%;
}

@keyframes heroFloat {
  0%, 100% {
    transform: translateY(0) rotate(-3deg);
  }
  50% {
    transform: translateY(-12px) rotate(3deg);
  }
}

@media (max-width: 600px) {
  .party {
    height: 190px;
  }

  .party img {
    width: 58px;
  }
}
@keyframes bob{50%{transform:translateY(-4px)}}
.tag{margin:0 0 18px;text-align:center;font-size:24px;color:#54416F;word-break:keep-all}
.go{display:block;width:auto;margin:0 auto;padding:12px 34px;background:#F2C14E}
.cap{margin:20px 0 0;text-align:center;font-size:16px;letter-spacing:.06em;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:380px){main{padding:64px 14px 24px}}
</style>
</head>

<main>
  <button class="bgm" id="bgm" aria-label="배경음악 재생">♪ 재생</button>
  <section id="start" class="screen round on">
    <p class="eyebrow">✦ A LITTLE FANTASY ADVENTURE ✦</p>
    <h1 class="stitle">당신이 동화 속 주인공이라면?</h1>
    <p class="ssub">당신은 어떤 세계에서 어떤 모습으로 살아갈까요?</p>
    <div class="party" id="party" aria-hidden="true"></div>
    <p class="tag">당신만의 이야기를 시작해 보세요.</p>
    <button class="big go" id="go">모험 시작하기 ▶︎</button>
    <p class="cap">PIXEL HEROES MBTI</p>

  <section id="quiz" class="screen">
    <div class="meta"><span id="prog">1 / 12</span></div>

    <button class="opt" id="a"></button>

    <button class="prev" id="prev">이전 질문</button>

  <section id="result" class="screen round">

      <div class="img" id="rImg"></div>

      <p class="role" id="rRole"></p>

</main>

 ESTP:["제이든","황금빛 모험가","행동력이 뛰어나고 변화에 빠르게 적응하며 도전을 즐긴다.","기회가 왔을 때 망설이면 이미 늦어!"],
 ESFP:["벨라","별빛 축제의 연주자","표현력이 풍부하고 주변 사람들과 순간의 즐거움을 나눈다.","음악이 시작되면 오늘은 모두의 축제야!"]
};

const $ = id => document.getElementById(id);
let answers = [];   // 0 = A, 1 = B
let cur = 0;

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  document.querySelector("main").classList.toggle("res", id === "result");
  document.body.classList.toggle("res", id === "result");
  window.scrollTo(0, 0);
}

function renderQ(){
  $("prog").textContent = (cur + 1) + " / 12";
  $("fill").style.width = ((cur + 1) / 12 * 100) + "%";
  $("q").textContent = Q[cur][0];
  $("a").innerHTML = "<b>A</b>";
  $("b").innerHTML = "<b>B</b>";
  $("a").append(Q[cur][1]);
  $("b").append(Q[cur][2]);
  $("a").classList.toggle("sel", answers[cur] === 0);
  $("b").classList.toggle("sel", answers[cur] === 1);
  $("prev").disabled = cur === 0;
}

function pick(v){
  answers[cur] = v;
  if (cur < 11){ cur++; renderQ(); }
  else { renderResult(); }
}

function calcType(){
  let t = "";
  for (let d = 0; d < 4; d++){
    const pair = DIMS[d * 3];
    let a = 0;
    for (let i = d * 3; i < d * 3 + 3; i++) if (answers[i] === 0) a++;
    t += a >= 2 ? pair[0] : pair[1];
  }
  return t;
}

function renderResult(){
  const t = calcType(), c = C[t];
  $("rType").textContent = t;
  const box = $("rImg");
  box.textContent = "";
  box.className = IMAGES[t] ? "img" : "img ph";
  if (IMAGES[t]){
    const im = document.createElement("img");
    im.src = IMAGES[t];
    im.alt = c[0] + " 캐릭터 이미지";
    box.append(im);
  } else {
    box.textContent = "캐릭터 이미지";
  }
  $("rName").textContent = c[0];
  $("rRole").textContent = c[1];
  $("rDesc").textContent = c[2];
  $("rQuote").textContent = "\u201C" + c[3] + "\u201D";
  show("result");
}

// 16개 캐릭터를 네모난 카드 없이 자유롭게 배치
const heroPositions = [
  [3, 12], [15, 45], [27, 5], [39, 48],
  [51, 8], [63, 45], [75, 10], [87, 43],
  [8, 65], [20, 15], [34, 68], [47, 18],
  [60, 67], [72, 17], [83, 68], [94, 15]
];

Object.keys(IMAGES).forEach((t, i) => {
  if (!IMAGES[t]) return;

  const im = new Image();
  im.src = IMAGES[t];
  im.alt = "";

  const pos = heroPositions[i % heroPositions.length];

  im.style.left = pos[0] + "%";
  im.style.top = pos[1] + "%";
  im.style.animationDelay = (i * 0.13) + "s";

  $("party").append(im);
});

$("go").onclick = () => {
  answers = []; cur = 0; renderQ(); show("quiz");
  if (!autoDone){ autoDone = true; setBgm(true); }
};
$("a").onclick = () => pick(0);
$("b").onclick = () => pick(1);
$("prev").onclick = () => { if (cur > 0){ cur--; renderQ(); } };
$("again").onclick = () => { answers = []; cur = 0; show("start"); };

/* 배경음악: 코드로 직접 만든 칩튠 반복 음악이라 따로 받을 파일도, 저작권 걱정도 없습니다.
   다른 무료 음원을 쓰고 싶다면 BGM_SRC에 data:audio/mp3;base64,... 를 넣으세요. */
const BGM_SRC = "";
const BPM = 92, STEP = 60 / BPM / 2;
const CH = [[48,60,64,67],[45,57,60,64],[41,53,57,60],[43,55,59,62]];   // 도, 라단조, 파, 솔
const MEL = ("76 . 79 . 84 . 81 79  81 . 79 . 76 . 72 -  72 . 76 . 81 . 79 76  74 . 79 . 76 74 72 -" +
             "  84 . 81 . 79 . 76 79  81 . 84 . 81 . 79 -  77 . 81 . 84 . 81 77  79 . 74 . 71 . 74 -").trim().split(/\s+/);
const NOTE = [];   // 박자별 [음, 길이]
MEL.forEach((t, i) => {
  if (t === "." || t === "-") return;
  let len = 1;
  while (MEL[i + len] === ".") len++;
  NOTE[i] = [+t, len];
});
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
let ctx = null, master = null, timer = null, audio = null, step = 0, nextT = 0, playing = false, autoDone = false;

function tone(m, t, dur, type, vol){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = hz(m);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

function playStep(s, t){
  const c = CH[(s >> 3) % 4], i = s & 7;
  if (i % 4 === 0) tone(c[0], t, STEP * 3.6, "triangle", 0.5);
  tone(c[1 + [0,1,2,1,0,1,2,1][i]], t, STEP * 0.9, "square", 0.1);
  if (NOTE[s]) tone(NOTE[s][0], t, STEP * NOTE[s][1] * 0.95, "square", 0.2);
}

function startBgm(){
  if (BGM_SRC){
    audio = audio || Object.assign(new Audio(BGM_SRC), { loop: true, volume: 0.5 });
    audio.play();
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = 0.18;
  master.connect(ctx.destination);
  step = 0; nextT = ctx.currentTime + 0.1;
  timer = setInterval(() => {
    while (nextT < ctx.currentTime + 0.3){
      playStep(step, nextT);
      nextT += STEP;
      step = (step + 1) % MEL.length;
    }
  }, 80);
}

function stopBgm(){
  if (audio) audio.pause();
  if (timer) clearInterval(timer);
  timer = null;
  if (ctx){ ctx.close(); ctx = null; }
}

function setBgm(on){
  playing = on;
  if (on) startBgm(); else stopBgm();
  $("bgm").classList.toggle("playing", on);
  $("bgm").textContent = on ? "♪ 정지" : "♪ 재생";
  $("bgm").setAttribute("aria-label", on ? "배경음악 정지" : "배경음악 재생");
}
$("bgm").onclick = () => setBgm(!playing);
</script>
